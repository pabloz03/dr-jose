<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Sin esto, la página carga siempre en claro y recién cambia a oscuro
         cuando React monta y lee la preferencia — un parpadeo visible. Un
         script externo (no inline: el CSP del proyecto es script-src 'self'
         sin 'unsafe-inline') bloqueante, antes que cualquier otra cosa, deja
         el atributo puesto antes del primer pintado. -->
    <script src="/theme-init.js"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#0A6F6A" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B1317" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Citas" />
    <meta name="description" content="Gestión de citas de ortodoncia — Dr. José Rodríguez, Ciudad de Guatemala." />
    <title>Citas Ortodoncia</title>
  </head>

    <div id="root"></div>
